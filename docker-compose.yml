# Postgres local para desenvolvimento e testes (decisão 4 de 0003).
# Uso: docker compose up -d
#      DATABASE_URL=postgres://postgres:postgres@localhost:5432/sciencily npm test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sciencily
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
